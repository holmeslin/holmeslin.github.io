baseURL: https://holmeslin.github.io/
locale: zh-tw
title: "Feng-Chi's Notes"
enableRobotsTXT: true
enableEmoji: true

module:
  imports:
    - path: github.com/hugo-toha/toha/v4
  mounts:
    - source: static
      target: static
    - source: ./node_modules/flag-icons/flags
      target: static/flags
    - source: ./node_modules/@fontsource/mulish/files
      target: static/files
    - source: ./node_modules/katex/dist/fonts
      target: static/fonts

languages:
  zh-tw:
    locale: zh-tw
    label: 繁體中文
    title: "Feng-Chi's Notes"
    weight: 1
defaultContentLanguage: zh-tw

markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 6
    ordered: false

# JSON is required for the theme's client-side search
outputs:
  home: [HTML, RSS, JSON]

sitemap:
  changefreq: weekly
  priority: 0.5
  filename: sitemap.xml

# Sidebar groups; posts attach to them via front matter `menu.sidebar.parent`
menus:
  sidebar:
    - identifier: go
      name: Go
      url: /tags/golang/
      weight: 10
    - identifier: javascript-web
      name: JavaScript / Web
      url: /tags/javascript/
      weight: 20
    - identifier: nginx-server
      name: Nginx / 伺服器
      url: /tags/server/
      weight: 30
    - identifier: clean-code
      name: Clean Code
      url: /tags/clean-code/
      weight: 40
    - identifier: site
      name: 網站建置
      url: /tags/hugo/
      weight: 50

params:
  logo:
    favicon: /images/site/favicon.png

  gitRepo: https://github.com/holmeslin/holmeslin.github.io
  gitBranch: develop

  features:
    theme:
      enable: true
      services:
        light: true
        dark: true
        default: system

    portfolio:
      enable: true

    blog:
      enable: true
      showAuthor: true

    comment:
      enable: false

    analytics:
      enable: false

    toc:
      enable: true

    tags:
      enable: true
      on_card: true

    flags:
      enable: false

    flowchart:
      enable: true
      services:
        mermaid:
          theme: default
          darkTheme: dark

    # Single `$` is deliberately not a delimiter: prose like "$100" must not turn into math
    math:
      enable: true
      services:
        katex:
          delimiters:
            - left: $$
              right: $$
              display: true
            - left: '\('
              right: '\)'
              display: false

    syntaxHighlight:
      enable: true
      services:
        hljs:
          noHighlightRe: /^no-highlight$/i

    copyCodeButton:
      enable: true

    readingTime:
      enable: true

    pagination:
      maxPostsPerPage: 12

  footer:
    enable: true
    navigation:
      enable: true
      customMenus: false
    contactMe:
      enable: true
    credentials:
      enable: true
    newsletter:
      enable: false
    disclaimer:
      enable: true
