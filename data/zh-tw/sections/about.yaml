summary: |
  20 年資訊經歷：前 8 年在 ISP 做網路維運，之後 12 年投入全端與平台開發，現任國家資通安全研究院軟體工程師。

  主力技術是 Go 與 Vue 3，熟悉 Node.js、PostgreSQL、Kubernetes＋Argo CD 與 GCP／AWS。曾主導全公司 GenAI 平台（Chat／MCP／RAG）、日均 950 萬次呼叫的 API Gateway，以及 20+ 套系統接入的統一 2FA 服務。

  日常以 Claude Code 進行 AI 輔助開發，習慣先寫規格再實作。這個網站是我的筆記本，年紀大了記不住，學到的就寫下來（哈哈）。

